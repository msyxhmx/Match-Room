<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../../src/theme.css" />
    <script src="common.js"></script>
    <title>Caption</title>
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: var(--font-web); }
      #wrap { position: absolute; left: 0; right: 0; bottom: 96px; display: flex; justify-content: center; }
      #cap { white-space: pre-line; max-width: 42ch; padding: 20px 44px; border-radius: var(--radius-card); text-align: center; text-wrap: balance;
        background: color-mix(in srgb, var(--text-primary) 82%, transparent); color: var(--surface-card);
        font-size: 44px; font-weight: 600; line-height: 1.3; }
    </style>
  </head>
  <body>
    <div id="wrap"><div id="cap"></div></div>
    <script>
      document.getElementById("cap").textContent = params.get("text") ?? "";
      window.__length = Number(params.get("len") ?? 3.6);
      window.__seek = (t) => {
        document.getElementById("wrap").style.opacity = ramp(t, 0, 0.2) * (1 - ramp(t, window.__length - 0.2, 0.2));
      };
      window.__seek(0);
    </script>
  </body>
</html>
