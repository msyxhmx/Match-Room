[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "halftime-insights"
version = "0.1.0"
description = "Half-time match analysis and second-half prediction on synthetic football events."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
model = ["scikit-learn==1.9.1", "scipy>=1.11", "xgboost==3.4.1", "shap==0.54.1", "joblib>=1.4", "pyarrow>=16"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
llm = ["openai>=1.40"]
adapters = ["kloppy==3.19.1"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]
all = ["halftime-insights[model,api,llm,adapters,dev]"]

[tool.setuptools.packages.find]
include = ["contract*", "sim*", "model*", "live*", "api*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
