# Builds the API image and pushes it to GitHub Container Registry.
# Azure Container Apps pulls it from there (see docs/deploy-azure.md);
# our subscription can't build images in Azure (ACR Tasks is blocked).
name: API image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - api/**
      - contract/**
      - live/**
      - model/**
      - sim/**
      - artifacts/**
      - .github/workflows/api-image.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - api/**
      - contract/**
      - live/**
      - model/**
      - sim/**
      - artifacts/**
      - .github/workflows/api-image.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/msyxhmx/match-room-api

jobs:
  build:
    runs-on: ubuntu-latest
    # Fork PRs can't push packages; same-repo PRs push a sha tag only.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
